<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#0a0a0f" />
  <title>Minesweeper</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../shared/kit.css" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
<!-- ARCADE-NAV (injected) -->
<a href="../index.html" id="arcadeBack" aria-label="Back to arcade"
   style="position:fixed;top:14px;left:14px;z-index:2147483647;display:flex;align-items:center;gap:7px;
          padding:8px 14px 8px 11px;font-family:'DM Sans',system-ui,sans-serif;font-size:13px;font-weight:600;
          letter-spacing:.5px;color:#e2e8f0;text-decoration:none;background:rgba(19,19,26,.82);
          border:1.5px solid #1e1e2e;border-radius:12px;backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);
          box-shadow:0 4px 18px rgba(0,0,0,.4);transition:border-color .2s,transform .15s,box-shadow .2s;">
  <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="#f97316" stroke-width="2.4"
       stroke-linecap="round" stroke-linejoin="round" style="flex-shrink:0;"><path d="M15 18l-6-6 6-6"/></svg>
  <span>Arcade</span>
</a>
<style>
  #arcadeBack:hover{border-color:#f97316;transform:translateY(-1px);box-shadow:0 6px 22px rgba(249,115,22,.25);}
  @media (max-width:520px){#arcadeBack span{display:none;} #arcadeBack{padding:9px;}}
  @media print{#arcadeBack{display:none;}}
</style>
<!-- /ARCADE-NAV -->

<main class="page" style="--page-w:800px">
  <header class="head">
    <div class="head-title">
      <h1 class="title">Minesweeper</h1>
      <p class="tagline">Clear the field without touching a mine. Numbers count adjacent mines.</p>
    </div>
    <div class="head-tools"><button class="icon-btn" id="sound"></button></div>
  </header>
  <div class="seg" id="diff"><button data-v="beginner">Beginner</button><button data-v="intermediate">Intermediate</button><button data-v="expert">Expert</button></div>
  <div class="bar">
    <div class="stats">
      <div class="stat hot"><span class="v" id="mines">10</span><span class="l">Mines left</span></div>
      <div class="stat"><span class="v" id="time">0</span><span class="l">Seconds</span></div>
      <div class="stat"><span class="v" id="best">–</span><span class="l">Best</span></div>
    </div>
    <button class="btn btn-sm mode" id="flagMode" aria-pressed="false" title="Flag mode (F)">
      <svg class="ico" viewBox="0 0 24 24"><path d="M5 21V4M5 4h11l-2 4 2 4H5"/></svg><span>Flag mode</span>
    </button>
    <button class="btn btn-sm" id="new">New</button>
  </div>
  <div class="arena">
    <div class="field-wrap"><div class="field" id="field" role="grid" aria-label="Minefield"></div></div>
    <div class="overlay" id="ov" hidden></div>
  </div>
  <p class="keys">Click to reveal · right-click or long-press to flag · click a number to clear around it · arrows + <kbd>Space</kbd> / <kbd>F</kbd></p>
</main>
<script src="../shared/kit.js"></script>
<script src="script.js"></script>
</body>
</html>
