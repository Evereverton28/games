<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#0a0a0f" />
  <title>O-Logic</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../shared/kit.css" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
<!-- ARCADE-NAV (injected) -->
<a href="../index.html" id="arcadeBack" aria-label="Back to arcade"
   style="position:fixed;top:14px;left:14px;z-index:2147483647;display:flex;align-items:center;gap:7px;
          padding:8px 14px 8px 11px;font-family:'DM Sans',system-ui,sans-serif;font-size:13px;font-weight:600;
          letter-spacing:.5px;color:#e2e8f0;text-decoration:none;background:rgba(19,19,26,.82);
          border:1.5px solid #1e1e2e;border-radius:12px;backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);
          box-shadow:0 4px 18px rgba(0,0,0,.4);transition:border-color .2s,transform .15s,box-shadow .2s;">
  <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="#f97316" stroke-width="2.4"
       stroke-linecap="round" stroke-linejoin="round" style="flex-shrink:0;"><path d="M15 18l-6-6 6-6"/></svg>
  <span>Arcade</span>
</a>
<style>
  #arcadeBack:hover{border-color:#f97316;transform:translateY(-1px);box-shadow:0 6px 22px rgba(249,115,22,.25);}
  @media (max-width:520px){#arcadeBack span{display:none;} #arcadeBack{padding:9px;}}
  @media print{#arcadeBack{display:none;}}
</style>
<!-- /ARCADE-NAV -->

<main class="page" style="--page-w:560px">
  <header class="head">
    <div class="head-title">
      <h1 class="title">O-Logic</h1>
      <p class="tagline">One O in every row, column and colour. No two O's may touch.</p>
    </div>
    <div class="head-tools"><button class="icon-btn" id="rulesBtn" aria-label="How to play"><svg class="ico" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><path d="M9.1 9a3 3 0 015.8 1c0 2-3 3-3 3M12 17h.01"/></svg></button><button class="icon-btn" id="setBtn" aria-label="Settings"><svg class="ico" viewBox="0 0 24 24"><path d="M4 21v-7M4 10V3M12 21v-9M12 8V3M20 21v-5M20 12V3M1 14h6M9 8h6M17 16h6"/></svg></button><button class="icon-btn" id="sound"></button></div>
  </header>
  <div class="seg" id="mode"><button data-v="levels">Levels</button><button data-v="daily">Daily</button><button data-v="random">Random</button></div>
  <div class="stats">
    <div class="stat"><span class="v" id="lvl">1</span><span class="l" id="lvlLabel">Level</span></div>
    <div class="stat"><span class="v" id="time">0:00</span><span class="l">Time</span></div>
    <div class="stat"><span class="v" id="placed">0/5</span><span class="l">O's placed</span></div>
    <div class="stat"><span class="v" id="best">–</span><span class="l">Best</span></div>
  </div>
  <div class="arena">
    <div class="board" id="board" role="grid" aria-label="O-Logic grid"></div>
    <div class="overlay" id="ov" hidden></div>
  </div>
  <div class="msg" id="msg" aria-live="polite"></div>
  <div class="tools">
    <button class="btn btn-sm" id="undo"><svg class="ico" viewBox="0 0 24 24"><path d="M9 14L4 9l5-5"/><path d="M4 9h10.5a5.5 5.5 0 010 11H11"/></svg>Undo</button>
    <button class="btn btn-sm" id="clear"><svg class="ico" viewBox="0 0 24 24"><path d="M3 6h18M8 6V4h8v2M6 6l1 14h10l1-14"/></svg>Clear</button>
    <button class="btn btn-sm" id="hint"><svg class="ico" viewBox="0 0 24 24"><path d="M9 18h6M10 22h4M12 2a7 7 0 00-4 12.7V17h8v-2.3A7 7 0 0012 2z"/></svg>Hint</button>
    <button class="btn btn-sm" id="more"><svg class="ico" viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/></svg><span id="moreLabel">Levels</span></button>
  </div>
  <p class="keys">Tap: blank → ✕ → O · drag to mark several ✕ · keys: arrows, <kbd>Space</kbd> cycle, <kbd>X</kbd>, <kbd>O</kbd>, <kbd>⌫</kbd>, <kbd>Z</kbd> undo, <kbd>H</kbd> hint</p>
</main>
<script src="engine.js"></script>
<script src="../shared/kit.js"></script>
<script src="script.js"></script>
</body>
</html>
