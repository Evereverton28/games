<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#0a0a0f" />
  <title>Pointers</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../shared/kit.css" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
<!-- ARCADE-NAV (injected) -->
<a href="../index.html" id="arcadeBack" aria-label="Back to arcade"
   style="position:fixed;top:14px;left:14px;z-index:2147483647;display:flex;align-items:center;gap:7px;
          padding:8px 14px 8px 11px;font-family:'DM Sans',system-ui,sans-serif;font-size:13px;font-weight:600;
          letter-spacing:.5px;color:#e2e8f0;text-decoration:none;background:rgba(19,19,26,.82);
          border:1.5px solid #1e1e2e;border-radius:12px;backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);
          box-shadow:0 4px 18px rgba(0,0,0,.4);transition:border-color .2s,transform .15s,box-shadow .2s;">
  <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="#f97316" stroke-width="2.4"
       stroke-linecap="round" stroke-linejoin="round" style="flex-shrink:0;"><path d="M15 18l-6-6 6-6"/></svg>
  <span>Arcade</span>
</a>
<style>
  #arcadeBack:hover{border-color:#f97316;transform:translateY(-1px);box-shadow:0 6px 22px rgba(249,115,22,.25);}
  @media (max-width:520px){#arcadeBack span{display:none;} #arcadeBack{padding:9px;}}
  @media print{#arcadeBack{display:none;}}
</style>
<!-- /ARCADE-NAV -->

<main class="page" style="--page-w:560px">
  <header class="head">
    <div class="head-title">
      <h1 class="title">Pointers</h1>
      <p class="tagline">Untangle the arrows. Each one escapes only if the way ahead of its head is clear.</p>
    </div>
    <div class="head-tools"><button class="icon-btn" id="sound"></button></div>
  </header>
  <div class="stats">
    <div class="stat"><span class="v" id="lvl">1</span><span class="l" id="lvlLabel">Level</span></div>
    <div class="stat"><span class="v" id="left">0</span><span class="l">Pointers left</span></div>
    <div class="stat hot"><span class="v hearts" id="hearts">♥♥♥</span><span class="l">Hearts</span></div>
    <div class="stat"><span class="v" id="hintsUsed">0</span><span class="l">Hints</span></div>
  </div>
  <div class="arena">
    <canvas id="cv" tabindex="0" aria-label="Pointer board. Use arrow keys to move the cursor and Enter to fire a pointer."></canvas>
    <div class="overlay" id="ov" hidden></div>
  </div>
  <div class="row grow">
    <button class="btn btn-sm" id="hint"><svg class="ico" viewBox="0 0 24 24"><path d="M9 18h6M10 22h4M12 2a7 7 0 00-4 12.7V17h8v-2.3A7 7 0 0012 2z"/></svg>Hint</button>
    <button class="btn btn-sm" id="restart"><svg class="ico" viewBox="0 0 24 24"><path d="M3 12a9 9 0 109-9 9 9 0 00-6.4 2.6L3 8"/><path d="M3 3v5h5"/></svg>Restart</button>
    <button class="btn btn-sm" id="levels"><svg class="ico" viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/></svg>Levels</button>
  </div>
  <p class="keys">Click or tap a pointer · hover to preview its path · <kbd>←</kbd><kbd>↑</kbd><kbd>→</kbd><kbd>↓</kbd> move cursor · <kbd>Enter</kbd> fire · <kbd>H</kbd> hint</p>
</main>
<script src="../shared/kit.js"></script>
<script src="script.js"></script>
</body>
</html>
