<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#0a0a0f" />
  <title>Tetris</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../shared/kit.css" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
<!-- ARCADE-NAV (injected) -->
<a href="../index.html" id="arcadeBack" aria-label="Back to arcade"
   style="position:fixed;top:14px;left:14px;z-index:2147483647;display:flex;align-items:center;gap:7px;
          padding:8px 14px 8px 11px;font-family:'DM Sans',system-ui,sans-serif;font-size:13px;font-weight:600;
          letter-spacing:.5px;color:#e2e8f0;text-decoration:none;background:rgba(19,19,26,.82);
          border:1.5px solid #1e1e2e;border-radius:12px;backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);
          box-shadow:0 4px 18px rgba(0,0,0,.4);transition:border-color .2s,transform .15s,box-shadow .2s;">
  <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="#f97316" stroke-width="2.4"
       stroke-linecap="round" stroke-linejoin="round" style="flex-shrink:0;"><path d="M15 18l-6-6 6-6"/></svg>
  <span>Arcade</span>
</a>
<style>
  #arcadeBack:hover{border-color:#f97316;transform:translateY(-1px);box-shadow:0 6px 22px rgba(249,115,22,.25);}
  @media (max-width:520px){#arcadeBack span{display:none;} #arcadeBack{padding:9px;}}
  @media print{#arcadeBack{display:none;}}
</style>
<!-- /ARCADE-NAV -->

<main class="page" style="--page-w:540px">
  <header class="head">
    <div class="head-title">
      <h1 class="title">Tetris</h1>
      <p class="tagline">Stack, spin and clear. Hold a piece for later.</p>
    </div>
    <div class="head-tools"><button class="icon-btn" id="sound"></button></div>
  </header>
  <div class="stats">
    <div class="stat"><span class="v" id="score">0</span><span class="l">Score</span></div>
    <div class="stat"><span class="v" id="lines">0</span><span class="l">Lines</span></div>
    <div class="stat"><span class="v" id="level">1</span><span class="l">Level</span></div>
    <div class="stat"><span class="v" id="best">0</span><span class="l">Best</span></div>
  </div>
  <div class="arena">
    <canvas id="cv" aria-label="Tetris board"></canvas>
    <div class="overlay" id="ov" hidden></div>
  </div>
  <div class="pad tpad">
    <button data-k="hold" aria-label="Hold">Hold</button>
    <button data-k="left" aria-label="Left"><svg class="ico" viewBox="0 0 24 24"><path d="M15 18l-6-6 6-6"/></svg></button>
    <button data-k="rotate" aria-label="Rotate"><svg class="ico" viewBox="0 0 24 24"><path d="M21 12a9 9 0 11-3-6.7L21 8M21 3v5h-5"/></svg></button>
    <button data-k="right" aria-label="Right"><svg class="ico" viewBox="0 0 24 24"><path d="M9 18l6-6-6-6"/></svg></button>
    <button data-k="soft" aria-label="Soft drop"><svg class="ico" viewBox="0 0 24 24"><path d="M6 9l6 6 6-6"/></svg></button>
    <button data-k="hard" aria-label="Hard drop"><svg class="ico" viewBox="0 0 24 24"><path d="M6 5l6 6 6-6M6 13l6 6 6-6"/></svg></button>
  </div>
  <p class="keys"><kbd>←</kbd><kbd>→</kbd> move · <kbd>↑</kbd>/<kbd>X</kbd> rotate · <kbd>Z</kbd> rotate back · <kbd>↓</kbd> soft drop · <kbd>Space</kbd> hard drop · <kbd>C</kbd> hold · <kbd>P</kbd> pause</p>
</main>
<script src="../shared/kit.js"></script>
<script src="script.js"></script>
</body>
</html>
